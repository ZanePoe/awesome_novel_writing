name: Refresh GitHub metrics
on:
  schedule:
    - cron: '37 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-metrics
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch complete snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/refresh_metrics.py
      - run: python scripts/build.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py --check
      - name: Commit generated catalogue
        shell: bash
        run: |
          git add data/metrics.json data/rankings.csv README.md docs/projects.md docs/rankings.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh GitHub maintenance snapshot'
          git push
